name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ucrt64:
    name: Windows (UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Read version
        id: version
        run: |
          v=$(sed -nE 's/^project\(VastGui VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          test -n "$v" || { echo "::error::version not found in CMakeLists.txt"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: VastGui-${{ steps.version.outputs.version }}-win64
          path: build/VastGui.exe
          retention-days: 14

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7

      # build.bat locates Visual Studio via vswhere and loads vcvars64.bat itself, so no setup action is needed.
      - name: Build
        run: build.bat msvc

      - name: Test
        run: build.bat msvc test

  linux:
    name: Linux (g++ 13)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build libglfw3-dev libgl-dev libcurl4-openssl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # build.sh keeps its own source lists and unity build; make sure it doesn't drift from CMakeLists.txt.
      - name: build.sh (unity build + tests)
        run: |
          ./build.sh
          ./build.sh test
